name: Dep Guard Dependency Gate
description: Scan dependency changes for supply-chain risk and write a SARIF log. Run after actions/checkout.
author: Vault & Compass LLC
branding:
  icon: shield
  color: blue

inputs:
  version:
    description: |
      The exact version of `@vaultcompass/dep-guard` to install, such as
      `0.6.0`. Validated against `^[0-9]+\.[0-9]+\.[0-9]+$`, and the default is
      the version this action shipped with.

      THIS USED TO DEFAULT TO `latest`, AND USED TO ACCEPT DIST-TAGS. Both are
      refused now, for two different reasons.

      A dist-tag means the program judging a pull request is whichever one the
      registry served that morning, rather than one decided in the workflow
      file and reviewable there.

      The sharper reason is that the old charset was not a version check at
      all. npm's specifier parser reads `@scope/name@<value>` as a PATH, not a
      version, when the value begins with a dot or ends in `.tgz`: `.`, `..`
      and `payload.tgz` all resolve against a directory instead of the
      registry. Combined with a step that ran from inside the checkout, that
      was one committed file away from the tree under judgment handing over its
      own scanner.

      A prerelease cannot be pinned either. The pattern that admits `-rc.1`
      admits most of what a dist-tag would, and the version deciding a pull
      request is not the place to widen a pattern for the convenience of
      testing one.
    required: false
    default: 0.6.0
  path:
    description: |
      Path to scan, relative to the workspace root. Must be 1..256 characters
      of `[A-Za-z0-9._/-]` and must not contain `..`, so it cannot escape
      GITHUB_WORKSPACE. (The charset is checked with `+` plus a separate
      length guard, never `{1,256}`: BSD regex sets RE_DUP_MAX to 255, so
      `{1,256}` fails to compile on macOS and rejects every path including
      `.`.)
    required: false
    default: .
  online:
    description: |
      Set to `true` to enable the registry-backed checks (unknown-package
      resolution, popularity asymmetry, registered-squat). Requires network
      access from the runner. Closed enum: `true` or `false`.
    required: false
    default: 'false'
  fail-on:
    description: |
      Severity threshold that fails the run: critical, high, medium, low, or
      none. Closed enum, validated against the same list dep-guard itself
      accepts. Left unset, dep-guard uses its own default (medium) or
      whatever .dep-guard.json configures.
    required: false
    default: ''
  trust-base:
    description: |
      Pull-request mode. dep-guard reads `.dep-guard.json`,
      `.dep-guard.local.json` and `.dep-guard.baseline.json` from this git
      ref instead of from the tree it is judging, so a pull request cannot
      turn the gate off in the same commit that carries what the gate exists
      to catch. A head-side change to any of them is reported and ignored.

      Left at the default, this is decided by the event: on a
      `pull_request` event the action passes `origin/$GITHUB_BASE_REF`, and
      on any other event it passes nothing and behaviour is unchanged. Set
      it to a ref to point pull-request mode at a different base.

      There is deliberately NO value that turns pull-request mode off, and
      `off` is refused with an error rather than ignored. On a
      same-repository `pull_request` event the workflow file runs from the
      pull request's own head, so an opt-out input would be settable by the
      very pull request whose control inputs it governs, which is the
      switch this mode exists to take away. Base-ref judging is the floor,
      not a knob. A repository that needs the old behaviour while it
      arranges `fetch-depth: 0` should stay pinned to `@v0.5.0` until it
      has arranged it.

      A pull_request run using this REQUIRES `actions/checkout` with
      `fetch-depth: 0`, so the base branch is present to read. Without it
      dep-guard exits 2 and the job fails, which is deliberate: a missing
      base is never a reason to fall back to trusting the head.

      Same charset rules as `path`, and additionally may not begin with
      `-`, so it cannot be read as a git option.
    required: false
    default: ''
  sarif-output:
    description: |
      Where to write the SARIF file, relative to the workspace root. Same
      path rules as `path`.
    required: false
    default: dep-guard-results.sarif
  upload-sarif:
    description: |
      Set to `false` to write the SARIF file without uploading it, for a
      repository without code scanning enabled (uploading there fails the
      job with a permissions error that has nothing to do with the scan).
    required: false
    default: 'true'

outputs:
  results-file:
    description: Absolute path to the written SARIF file
    value: ${{ steps.run.outputs.results_file }}
  exit-code:
    description: dep-guard's own exit code (0 clean, 1 blocking findings, 2 could not run)
    value: ${{ steps.run.outputs.exit_code }}

runs:
  using: composite
  steps:
    # Consumers must run actions/checkout on their repository BEFORE this action.

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '22'

    # Every input is validated before it can reach a shell.
    #
    # The reason this is a step of its own rather than inline guards in the
    # run script: GitHub substitutes `${{ inputs.* }}` into the script text
    # BEFORE the shell ever parses it, so no amount of quoting in the script
    # body can contain a hostile value. Values are passed through `env:`
    # instead, which the shell expands at runtime, and validated there.
    - name: Validate inputs
      shell: bash
      env:
        DG_VERSION: ${{ inputs.version }}
        DG_PATH: ${{ inputs.path }}
        DG_ONLINE: ${{ inputs.online }}
        DG_FAIL_ON: ${{ inputs.fail-on }}
        DG_SARIF_OUTPUT: ${{ inputs.sarif-output }}
        DG_UPLOAD: ${{ inputs.upload-sarif }}
        DG_TRUST_BASE: ${{ inputs.trust-base }}
      run: |
        set -euo pipefail

        # EXACT VERSIONS ONLY. Not a range, not a dist-tag, not `latest`, and
        # the two things that refusal buys are different.
        #
        # A tag hands the choice of program to the registry on the morning of
        # the run, so the version that scans a pull request stops being a
        # decision written down in the workflow file.
        #
        # The other one is sharper. npm's specifier parser reads
        # `@scope/name@<value>` as a PATH, not a version, when the value begins
        # with a dot or ends in `.tgz`: `.`, `..` and `payload.tgz` all resolve
        # against a directory rather than the registry. A charset that let
        # those through would be one committed file away from the tree under
        # judgment choosing its own scanner.
        if [[ ! "${DG_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          printf '::error::dep-guard: the `version` input must be an exact version like 0.6.0, and was %q\n' "${DG_VERSION}"
          printf '::error::A dist-tag such as latest, a range, or anything else is refused. A value beginning with a dot or ending in .tgz is read by npm as a path rather than a version.\n'
          exit 1
        fi

        case "${DG_ONLINE}" in
          true|false) ;;
          *)
            printf '::error::dep-guard: invalid `online` input: %q\n' "${DG_ONLINE}"
            printf '::error::Allowed: true | false\n'
            exit 1
            ;;
        esac

        case "${DG_UPLOAD}" in
          true|false) ;;
          *)
            printf '::error::dep-guard: invalid `upload-sarif` input: %q\n' "${DG_UPLOAD}"
            printf '::error::Allowed: true | false\n'
            exit 1
            ;;
        esac

        # Empty means "do not pass --fail-on at all", so dep-guard's own
        # default or the repository's .dep-guard.json decides. Any other
        # value has to be one dep-guard accepts, checked here rather than
        # left to fail deeper in with a less obvious message.
        case "${DG_FAIL_ON}" in
          ''|critical|high|medium|low|none) ;;
          *)
            printf '::error::dep-guard: invalid `fail-on` input: %q\n' "${DG_FAIL_ON}"
            printf '::error::Allowed: critical | high | medium | low | none\n'
            exit 1
            ;;
        esac

        # path / sarif-output / trust-base: relative, inside the workspace. No
        # `..` segments, no leading `/`, no leading `-`.
        #
        # The charset check uses `+` and a separate length guard, NOT
        # `{1,256}`: macOS bash uses a BSD regex engine with RE_DUP_MAX 255,
        # where `{1,256}` fails to compile and the match then rejects every
        # value, including the default `.`. scripts/tests/action-path-validation.test.mjs
        # keeps that regression from coming back.
        validate_path() {
          local name="$1"
          local value="$2"
          if [[ ! "${value}" =~ ^[A-Za-z0-9._/-]+$ ]] || (( ${#value} > 256 )); then
            printf '::error::dep-guard: invalid `%s` input: %q\n' "${name}" "${value}"
            printf '::error::Allowed: 1..256 chars of [A-Za-z0-9._/-]\n'
            exit 1
          fi
          if [[ "${value}" == *".."* ]]; then
            printf '::error::dep-guard: `%s` must not contain `..`: %q\n' "${name}" "${value}"
            exit 1
          fi
          if [[ "${value}" == /* ]]; then
            printf '::error::dep-guard: `%s` must be relative to the workspace: %q\n' "${name}" "${value}"
            exit 1
          fi
          # The leading-dash rule is not about escaping the workspace, and it
          # applies to every value rather than only to the ref: a path or a ref
          # beginning with `-` is read as an OPTION by whichever command
          # dep-guard hands it to. Caught here, where the message can name the
          # workflow input that produced it, which git cannot.
          if [[ "${value}" == -* ]]; then
            printf '::error::dep-guard: `%s` must not begin with a dash: %q\n' "${name}" "${value}"
            exit 1
          fi
        }

        validate_path "path" "${DG_PATH}"
        validate_path "sarif-output" "${DG_SARIF_OUTPUT}"

        # `.github/` holds the workflow file and the CODEOWNERS entry that
        # decide how this gate runs and who may change it. A SARIF written
        # there is one upload, commit or artifact step away from landing inside
        # the path a reviewer is protecting.
        if [[ "${DG_SARIF_OUTPUT}" == ".github" || "${DG_SARIF_OUTPUT}" == ".github/"* ]]; then
          printf '::error::dep-guard: `sarif-output` must not write under .github/: %q\n' "${DG_SARIF_OUTPUT}"
          printf '::error::That directory holds the workflow file and the CODEOWNERS entry that decide how this gate runs. Write the SARIF somewhere else.\n'
          exit 1
        fi

        # There is no opt-out value, and `off` is refused BY NAME rather
        # than left to fail the charset check with a confusing message.
        #
        # An earlier draft of this action accepted `off` to disable
        # pull-request mode. That was wrong, and the reason is the same
        # reason the mode exists: on a same-repository `pull_request` event
        # the workflow file runs from the pull request's own head, so the
        # pull request whose config and baseline are being held at arm's
        # length could add `trust-base: off` to the workflow in the very
        # commit being judged, and the boundary would be back to being a
        # setting the untrusted side controls. Base-ref judging is the
        # floor, not a knob. Refusing loudly, with the alternative in the
        # message, is what keeps someone from quietly re-adding it.
        # Matched in any capitalisation, because a value refused as `off` and
        # accepted as `Off` would be an opt-out with a shift key in front of
        # it: git would then be asked for a ref named Off, fail to resolve it,
        # and the run would exit 2 for a reason nobody could read.
        case "${DG_TRUST_BASE}" in
          [Oo][Ff][Ff])
            printf '::error::dep-guard: `trust-base: off` is not supported. Pull-request mode is not optional: on a same-repository pull_request event the workflow file runs from the pull request head, so an opt-out input would be settable by the pull request it governs.\n'
            printf '::error::To keep pre-0.6.0 behaviour while you add `fetch-depth: 0` to actions/checkout, pin this action to @v0.5.0.\n'
            exit 1
            ;;
        esac

        # trust-base is a git ref, not a path, but the same charset serves:
        # a ref is letters, digits, dots, dashes, underscores and slashes.
        # Empty means "decide from the event", so it is not validated as a
        # ref. The leading-dash rule it used to carry on its own now lives in
        # validate_path, which applies it to every value.
        if [[ -n "${DG_TRUST_BASE}" ]]; then
          validate_path "trust-base" "${DG_TRUST_BASE}"
        fi

    # THE SCANNER COMES FROM OUTSIDE THE TREE IT SCANS. Running dep-guard with
    # `npx` from inside the checkout put the whole choice of program inside the
    # tree under judgment, by two separate routes. A `.npmrc` committed by the
    # head repoints the registry npx fetches from. A
    # `node_modules/@vaultcompass/dep-guard` already present in the head, from
    # the workflow's own earlier install step, is what npx runs, with the
    # version pin acting only as a satisfaction check on a package the head
    # wrote. Now the package is installed from the registry at the version
    # pinned in the caller's workflow file, under a prefix in the runner temp,
    # and invoked from there by absolute path.
    #
    # WHAT THAT PIN DOES AND DOES NOT PROTECT. It takes the choice of program
    # out of the tree: the head's lockfile, manifest, node_modules and .npmrc no
    # longer decide what runs. It does not take that choice out of the workflow
    # file. On a pull_request event GitHub runs the workflow as it is in the
    # pull request's merge commit, so a pull request that edits the workflow can
    # change this pin, or delete the step outright, the same as it could rewrite
    # any other CI step; only pull_request_target runs the base branch's copy,
    # and that event carries the base's secrets and is the wrong one for judging
    # untrusted code. The control for a workflow edit is branch protection on
    # the base branch, with review required for the workflow path, and nothing
    # this action does can substitute for it. The boundary here is against the
    # TREE choosing its own judge.
    #
    # IT RUNS OUTSIDE THE CHECKOUT TOO, not just installs outside it. A
    # composite step with no working-directory runs at the workspace root, which
    # is the head's own tree: npm would then be started with the pull request's
    # .npmrc, package.json and lockfile under its cwd. In global mode npm does
    # not read a project's own configuration, so nothing here is known to depend
    # on that, and that is exactly why the step should not rest on it: the
    # reason it is safe would be a property of a version of npm rather than of
    # this file. Running from the runner temp costs nothing and takes the
    # question away.
    - name: Install dep-guard outside the workspace
      id: install
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        # Under the runner temp, which is outside the workspace and is cleaned
        # up by the runner. npm reads this variable itself, so nothing here has
        # to pass --prefix on a command line.
        npm_config_prefix: ${{ runner.temp }}/dep-guard-action
        DG_VERSION: ${{ inputs.version }}
      run: |
        set -eu
        mkdir -p "${npm_config_prefix}"
        npm install -g "@vaultcompass/dep-guard@${DG_VERSION}"

    - name: Run dep-guard
      id: run
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        # The binary the install step just wrote, by absolute path rather than
        # by name. A bare name would be resolved against PATH, and a workflow
        # that put its own node_modules/.bin on PATH before this action would
        # hand the head's copy back the resolution the install step took away.
        #
        # THE LAYOUT ASSUMED HERE IS THE LINUX AND MACOS ONE, where a global
        # install puts its shims in <prefix>/bin. On Windows npm puts them in
        # the prefix directory itself, and this path would not exist.
        DG_BIN: ${{ runner.temp }}/dep-guard-action/bin/dep-guard
        DG_PATH: ${{ inputs.path }}
        DG_ONLINE: ${{ inputs.online }}
        DG_FAIL_ON: ${{ inputs.fail-on }}
        DG_SARIF_OUTPUT: ${{ inputs.sarif-output }}
        DG_TRUST_BASE: ${{ inputs.trust-base }}
      run: |
        # NOT "set -uo pipefail". GitHub invokes a composite bash step as
        # `bash --noprofile --norc -eo pipefail {0}`, so errexit is
        # ALREADY ON before this script's first line. `set -uo pipefail`
        # adds -u and re-states pipefail but does nothing to clear -e, so
        # the shell aborted at the npx line the moment dep-guard exited
        # non-zero -- the entire interesting case -- and never reached the
        # status capture below. GITHUB_OUTPUT stayed empty, the upload
        # step had no file to upload, and findings were silently never
        # reported. Errexit is turned off explicitly around the call
        # instead, the same way vault-guard's action does it.
        # scripts/tests/action-run-script.test.mjs runs this very block
        # under those exact flags with a failing stub.
        #
        # So no `set` line here re-states the shell's mode. Errexit is
        # cleared narrowly, around the one command that is EXPECTED to
        # exit non-zero, and restored immediately afterwards, so every
        # other line in this script still fails the step if it breaks.

        ROOT="${GITHUB_WORKSPACE}"
        OUT="${ROOT}/${DG_SARIF_OUTPUT}"
        RESULTS_FILE=""
        mkdir -p "$(dirname "${OUT}")"

        # ABSOLUTE, built from the workspace. This step runs from the runner
        # temp rather than from the checkout, so a relative scan path would
        # resolve against the wrong directory. dep-guard resolves the scan
        # path and then hands it to git as its cwd, so an absolute one works
        # everywhere the relative one did.
        #
        # THIS IS NOT COSMETIC, and it is not separable from the move above.
        # Run from the runner temp with a relative `.`, dep-guard resolves the
        # runner temp as the repository, fails to resolve the trust base, and
        # exits 2 on EVERY run -- with a message telling the caller to fetch
        # the base branch with fetch-depth: 0, which they already did. A
        # permanently red required check, explained by advice that cannot fix
        # it. The two halves ship together or not at all.
        ARGS=(scan "${ROOT}/${DG_PATH}" --format sarif)
        if [[ "${DG_ONLINE}" == "true" ]]; then
          ARGS+=(--online)
        else
          # Explicit rather than merely omitted: a repository whose
          # .dep-guard.json sets "online": true would otherwise make
          # network requests from a workflow that did not ask for them.
          ARGS+=(--no-online)
        fi
        if [[ -n "${DG_FAIL_ON}" ]]; then
          ARGS+=(--fail-on "${DG_FAIL_ON}")
        fi

        # Pull-request mode. GITHUB_BASE_REF is set by GitHub on, and only
        # on, a pull_request event, which is exactly the run where the tree
        # being judged is written by someone who is not yet trusted. So the
        # event decides the default and no workflow has to remember to.
        #
        # origin/ prefixed, not bare: GITHUB_BASE_REF is a branch NAME
        # ("main"), and after actions/checkout only the remote-tracking ref
        # exists locally. A bare "main" would resolve to nothing on a
        # detached-HEAD checkout and dep-guard would exit 2, which is safe
        # but for the wrong reason and with a message about fetching that
        # the user has already done.
        #
        # There is no opt-out branch here on purpose: an explicit ref
        # REDIRECTS pull-request mode, it never disables it, and the
        # validate step refuses `off` before this line is reached. Empty on
        # a non-pull_request event simply passes nothing, so push and
        # schedule runs are unchanged.
        if [[ -n "${DG_TRUST_BASE}" ]]; then
          ARGS+=(--trust-base "${DG_TRUST_BASE}")
        elif [[ -n "${GITHUB_BASE_REF:-}" ]]; then
          ARGS+=(--trust-base "origin/${GITHUB_BASE_REF}")
        fi

        # SARIF goes to stdout and nothing else does, so this redirects
        # rather than tees: a `tee` of a text banner into a SARIF file is
        # how a sibling action in this family broke its own upload.
        set +e
        "${DG_BIN}" "${ARGS[@]}" > "${OUT}"
        SCAN_STATUS=$?
        set -e

        # Published only when there is something in it. dep-guard exits before
        # writing any SARIF when it could not run at all -- an unresolvable
        # trust base, a missing corpus -- and the redirect has already created
        # the target by then, so the file exists and is zero bytes. Handing
        # that path to upload-sarif fails the job with a SARIF parse error,
        # which buries the real cause under a complaint about the upload: the
        # exact confusion the guard on this step's output was added to prevent.
        if [[ -s "${OUT}" ]]; then
          RESULTS_FILE="${OUT}"
        else
          printf 'dep-guard: no SARIF was written to %s (the scan exited %s first), so there is nothing to upload.\n' "${OUT}" "${SCAN_STATUS}"
        fi

        echo "results_file=${RESULTS_FILE}" >> "${GITHUB_OUTPUT}"
        echo "exit_code=${SCAN_STATUS}" >> "${GITHUB_OUTPUT}"

        # Deliberately exits 0 here, whatever dep-guard said. The upload
        # step below has to run even for a scan that found blocking
        # findings -- that is the case whose SARIF matters most -- and the
        # real exit code is re-raised in the last step, after the upload.
        exit 0

    # always(), so a failure anywhere above still gets whatever SARIF was
    # produced into code scanning. Guarded on results_file being non-empty
    # because the run step may not have got far enough to set it, and
    # upload-sarif given an empty path fails with an error about the
    # upload rather than about the scan, burying the real cause.
    - name: Upload SARIF
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.run.outputs.results_file != '' }}
      uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
      with:
        sarif_file: ${{ steps.run.outputs.results_file }}
        category: dep-guard

    # The gate, re-raised after the upload so a failing scan still gets its
    # findings into code scanning. Passes dep-guard's own exit code through
    # rather than collapsing every non-zero to 1: 2 means dep-guard could
    # not run its checks at all, which is a different fact from "there are
    # blocking findings" and must not be reported as one. This is the same
    # rule the generated pre-commit hook follows.
    - name: Report dep-guard result
      if: ${{ always() }}
      shell: bash
      env:
        DG_EXIT_CODE: ${{ steps.run.outputs.exit_code }}
      run: |
        set -uo pipefail

        # Empty means the run step never got far enough to record a code:
        # an input failed validation, or the step itself died. That is not
        # a clean scan and must not be reported as one, so it fails here
        # rather than passing through a bare `exit ""`, which bash rejects
        # as a bad argument and which would then exit 1 for a reason that
        # has nothing to do with the scan.
        if [[ -z "${DG_EXIT_CODE}" ]]; then
          printf '::error::dep-guard did not run to completion, so no result was recorded and there are no findings either way. An input failed validation, or a step died before the scan ran. See the earlier steps.\n'
          exit 2
        fi

        # Only 0 and 1 are verdicts. Everything else, including the codes the
        # SHELL produces when the binary is missing or not executable, is
        # could-not-run and is re-raised as 2, so a required check still fails
        # and the message says why rather than claiming findings nobody found.
        case "${DG_EXIT_CODE}" in
          0)
            echo "dep-guard: no blocking findings."
            exit 0
            ;;
          1)
            printf '::error::dep-guard found blocking findings (exit 1).\n'
            exit 1
            ;;
          2)
            printf '::error::dep-guard could not complete its checks (exit 2): an unresolvable trust base, a missing corpus, or a scan path that is not a repository. This is not a clean scan.\n'
            exit 2
            ;;
          *)
            printf '::error::dep-guard did not produce a result: the run step exited %s, which is not one of the three codes dep-guard itself uses. npm or the dep-guard binary failed to run, so nothing scanned this change. Reported as could not run.\n' "${DG_EXIT_CODE}"
            exit 2
            ;;
        esac
