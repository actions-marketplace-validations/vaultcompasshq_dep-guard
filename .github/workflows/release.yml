name: Release

# Tag triggered only. Push- and PR-triggered CI now lives in ci.yml (added
# once dep-guard is public, so its standard-runner minutes are free
# regardless of the org's billing state for private repos) and gates every
# merge to main. This workflow does not replace that gate - it re-verifies
# the same checks (pnpm build / pnpm typecheck / pnpm lint / pnpm test)
# right before anything is published, in case main moved between the
# merge and the tag.
#
# Two kinds of release come through here, decided by the "Decide the
# release kind" step below:
#
#   * a PACKAGE release, where the tag reads "v" + the version both
#     packages carry. Everything in this file runs.
#   * an ACTION-ONLY release, where the tag moves past the scanner version
#     and the packages stay where they are (v0.6.1 was the first). The
#     code gates above still run on it -- they are what covers the
#     action.yml and docs such a release actually ships, and this workflow
#     never learns whether ci.yml ran on the exact commit that got tagged.
#     What is skipped is everything that exists to protect a publish that
#     does not happen: the ~10-15 minute registry walk in "Build the
#     shipped corpus" and its checks, the packed-tarball install gate, and
#     the publish itself. The run then resolves the tag and cuts a
#     GitHub Release saying nothing was published.
#
# docs/INVARIANTS.md, "The action tag and the scanner version are two
# numbers", is the long version of why those are two numbers at all.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Serializes every release attempt across the whole repository, tag
# triggered or workflow_dispatch, so a manual re-run overlapping a
# tag-triggered run cannot both pass the "already published" check before
# either publishes and race each other into a rejected duplicate-version
# publish. Never cancel a run mid-publish; queue the next one instead.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      # Exactly "true" or "false", written by the decision step, and only
      # after every condition in scripts/lib/release-kind.mjs held.
      #
      # Every condition that reads it is spelled POSITIVELY -- publish-side
      # steps run on "== 'false'", the action-only Release body on
      # "== 'true'" -- never "!= 'true'". The difference only shows up when
      # the value is neither: an output that is empty or missing (a step
      # renamed, an id typo, a future edit that fails to set it) makes
      # "!= 'true'" TRUE, which would publish on a run that never decided
      # anything. Both spellings are equally readable and only one of them
      # fails closed.
      action_only: ${{ steps.kind.outputs.action_only }}

    steps:
    # Runs before checkout on purpose: GITHUB_REF and github.event_name are
    # populated from the trigger itself, not from anything in the tree, so
    # this needs nothing checked out to decide. workflow_dispatch has no
    # branch restriction of its own, so a manual run started from any other
    # branch would build and publish THAT branch's code under the version
    # its package.json files happen to carry -- an unreviewed, un-tagged
    # publish. An explicit failing step is used instead of a job-level "if:"
    # so a maintainer who fat-fingers the branch dropdown gets a loud,
    # legible error naming the ref, rather than a run that silently reports
    # "skipped" with no explanation.
    #
    # The tag-push trigger is NOT inherently restricted to main the way the
    # comment here used to imply: "git tag v0.1.0 <any-commit> && git push
    # --tags" fires this workflow from any commit, on or off main, with a
    # real tag and matching GitHub Release. See the ancestry check in
    # "Decide the release kind, and refuse a tag that is neither" below for
    # how the tag path guards against that.
    - name: Refuse workflow_dispatch from anywhere but main
      if: github.event_name == 'workflow_dispatch'
      run: |
        set -euo pipefail
        if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
          echo "::error::Manual workflow_dispatch run from '${GITHUB_REF}', not 'refs/heads/main'. A manual dispatch from any other branch would build and publish that branch's code. Re-run from main, or push a 'v*' tag instead."
          exit 1
        fi

    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 22.14.0
        cache: 'pnpm'
        registry-url: 'https://registry.npmjs.org'

    # Runs this early -- right after Node setup, before install/build/test
    # and the ~10-15 minute, ~430-request corpus walk further down (see
    # "Build the shipped corpus") -- on purpose. Every failure this step
    # catches is a human mistake made at tag time: a mistyped tag, a
    # version left unbumped, a tag pushed on the wrong commit. None of that
    # depends on anything pnpm install, build, or test produce -- the step
    # below reads the two package.json files via "node -p", talks to git
    # directly, and runs scripts/classify-release-tag.mjs, which uses node
    # builtins only (no dependency of this repository is installed yet, and
    # that script must keep it that way) plus, on the action-only path, two
    # "npm view" lookups. Catching the mistake after the corpus walk
    # costs fifteen minutes and several hundred requests against a public
    # registry replica; catching it here costs about a minute. Running it
    # this early also makes the ancestry check below cheap to exercise
    # deliberately with a disposable tag, which matters because that check
    # has never been observed running in real CI.
    #
    # Everything above this point can fail and be re-run harmlessly; this
    # step exists because everything below it cannot. Tag resolution used
    # to happen AFTER "Publish to npm" (see "Resolve release tag" below),
    # so a mistyped tag published whatever version core and cli's
    # package.json files happened to carry -- irreversibly, since a
    # publish cannot be taken back -- and then produced a GitHub Release
    # describing a publish that never actually matched the tag. Checking
    # BEFORE publish, not after, is the entire point of this step.
    #
    # Three assertions, all fatal:
    #   1. core and cli versions must be EQUAL. The two packages are
    #      published in lockstep on purpose -- see the comment on the
    #      publish loop below for why a cli release without a matching
    #      core bump is not a smaller mistake, it is a silent one.
    #   2. when this run is tag-triggered, the tag must be one of the two
    #      release shapes this repository has, and the step decides WHICH
    #      -- that is the "action_only" output every later step reads.
    #      A tag that reads "v" + the package version is a package
    #      release and everything proceeds as it always has. Any other tag
    #      is an action-only CANDIDATE, and is refused unless it is exact
    #      semver, strictly greater than the package version by numeric
    #      ordering, written down as a "## [X.Y.Z]" entry in CHANGELOG.md
    #      at the tagged commit, backed by both packages already being on
    #      the npm registry at that package version, and matched by
    #      action.yml's own version default. The package path is checked
    #      too, not merely admitted: it requires action.yml's version
    #      default to equal the version being published, since otherwise
    #      the tag the release creates installs a different scanner than
    #      the release put on npm. scripts/lib/release-kind.mjs holds those
    #      rules and the reasoning for each; scripts/tests/
    #      release-kind.test.mjs holds the cases, registry lookup and all,
    #      which is why this is a script rather than four more lines of
    #      bash here. This half only applies to a tag push --
    #      workflow_dispatch has no tag at all (GITHUB_REF_TYPE is
    #      "branch") and is covered instead by the ref guard above.
    #
    #      The old version of this step knew only the first shape and
    #      hard-failed on everything else, so the v0.6.1 action-only tag
    #      push went red here and never got a Release page. Admitting the
    #      second shape must not weaken what the first one bought: a
    #      mistyped or mis-pointed tag still publishes nothing and still
    #      never describes an unpublished version in a Release.
    #   3. when this run is tag-triggered, the tagged commit must be an
    #      ancestor of origin/main. "git tag v0.1.0 <any-commit> && git push
    #      --tags" fires this workflow from any commit, on or off main; a
    #      tag on a side branch would otherwise walk straight into an OIDC
    #      trusted publish around branch protection, with a real tag and a
    #      matching GitHub Release to show for it. This applies to BOTH
    #      kinds of release: an action-only tag publishes nothing, but it
    #      still moves the ref people write in "uses:", which is the thing
    #      actually running inside their workflows.
    - name: Decide the release kind, and refuse a tag that is neither
      id: kind
      run: |
        set -euo pipefail
        CORE_NAME="$(node -p "require('./packages/core/package.json').name")"
        CORE_VERSION="$(node -p "require('./packages/core/package.json').version")"
        CLI_NAME="$(node -p "require('./packages/cli/package.json').name")"
        CLI_VERSION="$(node -p "require('./packages/cli/package.json').version")"

        # GITHUB_REF_NAME is always set by Actions (a branch name on
        # workflow_dispatch, a tag name on a tag push), so a ${VAR:-fallback}
        # here would never actually trigger -- a dispatch run would read
        # "tag is main", which is not even true (a dispatch run has no tag
        # at all). Read GITHUB_REF_TYPE instead of guessing from emptiness:
        # --tag is passed only on a real tag push, and the script's answer
        # for a run without one is always "package release".
        #
        # The script writes action_only and scanner_version to
        # $GITHUB_OUTPUT itself, so nothing here parses its stdout.
        if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
          node scripts/classify-release-tag.mjs \
            --tag "${GITHUB_REF_NAME}" \
            --core-name "${CORE_NAME}" \
            --core-version "${CORE_VERSION}" \
            --cli-name "${CLI_NAME}" \
            --cli-version "${CLI_VERSION}" \
            --action-yml action.yml \
            --changelog CHANGELOG.md

          # The checkout step above uses actions/checkout's default
          # fetch-depth (1), so this job's working copy holds only the
          # tagged commit itself, with no history connecting it to
          # origin/main and no origin/main ref at all yet. Unshallow first
          # (only when the repo actually is shallow -- calling --unshallow
          # on a complete repo is a hard error, and nothing above this step
          # promises which one this checkout is), then fetch main by name
          # into an explicit local ref, since a tag-triggered checkout
          # never sets one up on its own.
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --unshallow origin
          fi
          git fetch origin main:refs/remotes/origin/main

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not an ancestor of origin/main. A tag pushed at a commit off main would otherwise walk straight into an OIDC trusted publish around branch protection, and an action-only tag at such a commit would ship that commit's action.yml to everyone who pins the tag. Refusing to release."
            exit 1
          fi
        else
          node scripts/classify-release-tag.mjs \
            --core-name "${CORE_NAME}" \
            --core-version "${CORE_VERSION}" \
            --cli-name "${CLI_NAME}" \
            --cli-version "${CLI_VERSION}" \
            --action-yml action.yml \
            --changelog CHANGELOG.md
        fi

        echo "Release kind decided: core=${CORE_VERSION} cli=${CLI_VERSION} ref_type=${GITHUB_REF_TYPE} ref_name=${GITHUB_REF_NAME}"

    # The code gates run on BOTH kinds of release, deliberately.
    #
    # The tempting argument is that ci.yml already ran them on this commit,
    # so an action-only release can skip them. It does not hold. The
    # ancestry check above proves the tagged commit is an ANCESTOR of main,
    # which is weaker than "a commit ci.yml ran on": every intermediate
    # commit of a merged PR branch is an ancestor of main, none of them got
    # a CI run of its own, and a tag can be pushed at one. "ci.yml covered
    # this commit" is an assumption about which commit was tagged, not
    # something this workflow knows.
    #
    # And an action-only release's entire payload is action.yml plus docs
    # -- exactly what "pnpm lint" (the public-repository hygiene guard,
    # over tracked files) and the action suites under scripts/tests/ check.
    # Skipping the gates there would skip the checks aimed at the only
    # files such a release actually ships.
    #
    # What an action-only release genuinely does not need starts below:
    # the corpus walk, and everything that exists to protect a publish.
    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build packages
      run: pnpm build

    - name: Typecheck
      run: pnpm typecheck

    - name: Lint (public repository hygiene guard)
      run: pnpm lint

    - name: Run tests
      run: pnpm test

    # MUST run after "Run tests", never before. packages/cli/tests/cli.test.ts
    # has a case ("a first run with no corpus built yet") that asserts a
    # scan with no --corpus-dir and nothing at core's default corpus path
    # (packages/core/data/corpus) fails with an actionable corpus-missing
    # message. That default path is gitignored and empty in every checkout
    # unless something writes there first -- if this step ran before the
    # test suite, that test would fail (or worse, silently stop testing
    # what it claims to, if it were ever weakened to tolerate a populated
    # default path). See that test's own self-diagnosing precondition
    # check for the same explanation from the test's side.
    #
    # This step makes every release depend on replicate.npmjs.com, the
    # public registry replica -- roughly 430 requests and 10 to 15 minutes
    # (see scripts/build-corpus.mjs). A failure here fails the release
    # closed, before anything is published, which is the correct direction:
    # a release with no corpus, or a corpus this build could not verify, is
    # worse than a delayed release.
    #
    # Skipped on an action-only release: the corpus this would build goes
    # into a core tarball that release does not publish, so the walk would
    # spend ten to fifteen minutes and several hundred requests against a
    # public registry replica producing an artifact nothing ships.
    - name: Build the shipped corpus
      if: steps.kind.outputs.action_only == 'false'
      run: node scripts/build-corpus.mjs --out packages/core/data/corpus

    # Refuses to publish a corpus that is not actually fit to ship -- see
    # scripts/lib/shippable-corpus.mjs for the full set of checks (all four
    # files present, formatVersion and walkComplete both present and
    # correct, a name-count floor, and a real load through loadCorpus with
    # a known-popular name resolving as present). This is stricter than
    # what loadCorpus itself tolerates at read time, by design.
    - name: Check the corpus is fit to publish
      if: steps.kind.outputs.action_only == 'false'
      run: node scripts/check-shippable-corpus.mjs packages/core/data/corpus

    # Packs packages/core the same way the "Publish to npm" step below will,
    # then reads the pack listing back and asserts all four corpus files are
    # in it. This is the one check in this workflow that verifies the
    # corpus actually reaches the published tarball. Everything above this
    # step gates the corpus ON DISK (build, then shippability); nothing
    # before this point checks that packages/core/package.json's "files"
    # array actually carries that on-disk corpus into what npm packs.
    # scripts/tests/core-package-files.test.mjs only asserts the string
    # "data" is present in that array, which does not prove npm packs the
    # directory. See scripts/check-corpus-packed.mjs for the command this
    # runs and how it was verified.
    - name: Check the corpus reaches the packed tarball
      if: steps.kind.outputs.action_only == 'false'
      run: node scripts/check-corpus-packed.mjs

    # This is the only pre-publish step that executes the shipped artifact
    # in the shipped layout -- every gate above this point checks the
    # corpus on disk, the packed tarball's file listing, or package.json's
    # metadata, but none of them actually installs the packages the way a
    # real user would and runs the resulting binary. It exists because a
    # previous audit had to verify that layout by hand.
    #
    # A real corpus already exists at packages/core/data/corpus at this
    # point in the job (built several steps above and verified shippable
    # and packed), so packing core below includes it -- that is the point:
    # this exercises the SAME corpus the gates above just verified, not a
    # stand-in. (A throwaway-clone verification done before this step was
    # written used a small hand-written corpus instead, to avoid a real
    # registry walk; that is a property of the verification, not of this
    # step, which always runs against whatever corpus this job actually
    # built.)
    #
    # Mechanics verified by hand in that throwaway clone: "pnpm pack
    # --pack-destination" rewrites cli's "workspace:*" dependency on core
    # to an exact version pin, the same rewrite "pnpm publish" performs, so
    # installing both tarballs in ONE "npm install" invocation resolves
    # the local pin correctly -- no separate install-core-first step and
    # no registry lookup needed.
    - name: Install the packed tarballs and run the shipped binary
      if: steps.kind.outputs.action_only == 'false'
      run: |
        set -euo pipefail
        PACK_DIR="$(mktemp -d)"
        pnpm --dir packages/core pack --pack-destination "${PACK_DIR}"
        pnpm --dir packages/cli pack --pack-destination "${PACK_DIR}"

        # Exact filenames, computed from the versions the assert step above
        # already validated, not a glob: "vaultcompass-dep-guard-*.tgz"
        # also matches "vaultcompass-dep-guard-core-*.tgz" (npm dedupes the
        # resulting duplicate argument today, harmlessly, but a release
        # gate should never depend on that rather than on naming its inputs
        # exactly).
        CORE_VERSION="$(node -p "require('./packages/core/package.json').version")"
        CLI_VERSION="$(node -p "require('./packages/cli/package.json').version")"
        CORE_TARBALL="${PACK_DIR}/vaultcompass-dep-guard-core-${CORE_VERSION}.tgz"
        CLI_TARBALL="${PACK_DIR}/vaultcompass-dep-guard-${CLI_VERSION}.tgz"

        INSTALL_DIR="$(mktemp -d)"
        # "npm install --prefix" creates its own package.json in
        # INSTALL_DIR the first time it runs there, so no separate init
        # step is needed. "npm init -y --prefix" must NOT be used for this
        # -- npm init ignores --prefix entirely and templates into
        # process.cwd() instead, so it silently writes/normalizes a
        # package.json in THIS CHECKOUT'S ROOT mid-release rather than in
        # INSTALL_DIR, which is never what this step wants.
        npm install --prefix "${INSTALL_DIR}" "${CORE_TARBALL}" "${CLI_TARBALL}"

        BIN="${INSTALL_DIR}/node_modules/.bin/dep-guard"

        # No --corpus-dir anywhere below: the whole point is to resolve the
        # corpus at its default path inside the installed package, exactly
        # as a real user's install would.
        set +e
        "${BIN}" check react --format json > "${INSTALL_DIR}/known.json"
        KNOWN_EC=$?
        "${BIN}" check totally-made-up-hallucinated-xyz123 --format json > "${INSTALL_DIR}/unknown.json"
        UNKNOWN_EC=$?
        VERSION_OUT="$("${BIN}" --version)"
        VERSION_EC=$?
        set -e

        if [[ "${KNOWN_EC}" -ne 0 ]]; then
          echo "::error::Expected 'dep-guard check react' to exit 0 from the packed tarball install. Got exit ${KNOWN_EC}."
          cat "${INSTALL_DIR}/known.json" || true
          exit 1
        fi

        node -e "
          const fs = require('fs');
          if (${UNKNOWN_EC} === 0) {
            console.error('Expected dep-guard check <hallucinated-name> to exit non-zero from the packed tarball install.');
            process.exit(1);
          }
          const j = JSON.parse(fs.readFileSync('${INSTALL_DIR}/unknown.json', 'utf8'));
          const hasUnknown = (j.findings || []).some((f) => f.ruleId === 'unknown-package');
          if (!hasUnknown) {
            console.error('dep-guard check <hallucinated-name> exited non-zero but carried no unknown-package finding.');
            console.error(fs.readFileSync('${INSTALL_DIR}/unknown.json', 'utf8'));
            process.exit(1);
          }
        "

        EXPECTED_VERSION="$(node -p "require('./packages/cli/package.json').version")"
        if [[ "${VERSION_EC}" -ne 0 || "${VERSION_OUT}" != "${EXPECTED_VERSION}" ]]; then
          echo "::error::Expected 'dep-guard --version' to print ${EXPECTED_VERSION} from the packed tarball install, got '${VERSION_OUT}' (exit ${VERSION_EC})."
          exit 1
        fi

        echo "Install-and-run gate passed: react known, a hallucinated name unknown, --version prints ${EXPECTED_VERSION}."

    # npm Trusted Publishing (OIDC): no NPM_TOKEN, auth via id-token: write
    # plus a trusted publisher configured per @vaultcompass/* package.
    # Requires npm CLI >= 11.5.1 (Node >= 22.14.0). Pin major 11 - npm@12
    # needs a newer Node than this job runs. Mirrors vault-guard's
    # release.yml, the model for this workflow.
    - name: Upgrade npm for OIDC trusted publishing
      if: steps.kind.outputs.action_only == 'false'
      run: npm install -g npm@11

    # dep-guard-cli depends on dep-guard-core via workspace:*, which pnpm
    # rewrites to a real semver range at publish time - core still
    # publishes first for a clean read of "what's live" if this fails
    # partway through. Skips a package already on the registry at its
    # current version, so a failed mid-release can be re-run without
    # erroring on a duplicate version.
    #
    # That skip is correct for exactly one situation -- re-running a
    # release that failed partway, where the packages already published
    # are done and only the rest need to happen -- and is a silent no-op
    # for a different one it must never be asked to handle: a corrective
    # re-release of a version that already went out broken. npm does not
    # allow re-publishing a version once it exists, broken or not, so
    # there is no version number this skip can be told to overwrite; the
    # only way to ship a fix is a NEW version, bumped in both packages
    # together (see the lockstep assertion above). A burned version number
    # is never re-released -- it is superseded by the next one.
    - name: Publish to npm
      if: steps.kind.outputs.action_only == 'false'
      run: |
        set -euo pipefail
        for dir in packages/core packages/cli; do
          name="$(node -p "require('./${dir}/package.json').name")"
          ver="$(node -p "require('./${dir}/package.json').version")"
          if [[ "$(npm view "${name}@${ver}" version 2>/dev/null || true)" == "${ver}" ]]; then
            echo "Skip ${name}@${ver} (already on registry)"
            continue
          fi
          echo "Publishing ${name}@${ver}"
          pnpm --filter "${name}" publish --access public --no-git-checks
        done

    - name: Resolve release tag
      id: meta
      run: |
        set -euo pipefail
        if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
        else
          echo "tag=v$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"
        fi

    # Two Release steps, one per release kind, rather than one step with a
    # computed body. The body is the only difference between them, and it
    # is the part that must not be wrong: "Published ... to npm" appears
    # under exactly one condition, the same condition that let the publish
    # step run at all, so an action-only release cannot announce a publish
    # that did not happen. A single step with an interpolated body would
    # put that claim one expression edit away from being unconditional.
    - name: Create GitHub Release
      if: steps.kind.outputs.action_only == 'false'
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        tag_name: ${{ steps.meta.outputs.tag }}
        target_commitish: ${{ github.sha }}
        generate_release_notes: true
        body: |
          Published `@vaultcompass/dep-guard` and `@vaultcompass/dep-guard-core` to npm.

    # The action-only body. It has to answer the question a reader of this
    # Release page actually has -- "the tag moved, so what am I getting?"
    # -- which is a scanner version that did not move with it. See
    # docs/INVARIANTS.md, "The action tag and the scanner version are two
    # numbers".
    - name: Create GitHub Release (action-only)
      if: steps.kind.outputs.action_only == 'true'
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        tag_name: ${{ steps.meta.outputs.tag }}
        target_commitish: ${{ github.sha }}
        generate_release_notes: true
        body: |
          Action-only release. `${{ steps.meta.outputs.tag }}` moves the composite action; the scanner it installs stays at `${{ steps.kind.outputs.scanner_version }}`, which was already on npm before this tag.

          Nothing was published to npm by this release.

          See CHANGELOG.md for what changed.

  smoke-published:
    name: Smoke test published CLI
    needs: release
    # Nothing was published on an action-only release, so there is nothing
    # here to smoke test: every command below installs
    # @vaultcompass/dep-guard at the version derived from the tag, and on
    # an action-only tag that version does not exist on the registry and
    # never will. The job would wait out its twelve registry polls and
    # then fail a release that did exactly what it was supposed to.
    if: needs.release.outputs.action_only == 'false'
    runs-on: ubuntu-latest
    steps:
      # No checkout step: this job's whole point is to exercise ONLY what a
      # real installer gets from npm, and every command below reads solely
      # from the installed @vaultcompass/dep-guard package (no --corpus-dir,
      # no repo files of any kind). Re-add a checkout only if a future
      # change here needs something from this repository directly.
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install published package and assert it scans correctly
        shell: bash
        env:
          # Read from the release job's own output rather than recomputing
          # the tag/version resolution a second time - two copies of that
          # branching logic could drift and have the two jobs disagree on
          # which version was just released.
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          echo "Smoke testing @vaultcompass/dep-guard@${VERSION}"

          FOUND=0
          for i in $(seq 1 30); do
            if [[ "$(npm view "@vaultcompass/dep-guard@${VERSION}" version 2>/dev/null)" == "${VERSION}" ]]; then
              echo "Package visible on registry."
              FOUND=1
              break
            fi
            echo "Waiting for npm registry (attempt ${i}/30)..."
            sleep 10
          done
          if [[ "${FOUND}" -ne 1 ]]; then
            echo "::error::Timed out waiting for @vaultcompass/dep-guard@${VERSION} on the npm registry."
            exit 1
          fi

          TMP=$(mktemp -d)
          cd "${TMP}"
          npm init -y >/dev/null 2>&1
          npm install "@vaultcompass/dep-guard@${VERSION}"

          # No --corpus-dir anywhere below. That is the whole point of this
          # job: it has to exercise the corpus that actually shipped INSIDE
          # the published package (packages/core's "files" now lists
          # "data" alongside "dist" - see packages/core/package.json) at
          # the default path scan.ts resolves when nothing overrides it.
          # Pointing this job at the repository's fixture corpus, the way
          # it used to, would smoke-test a corpus that never left this
          # checkout and prove nothing about what got published.
          set +e
          ./node_modules/.bin/dep-guard check react --format json > known-out.json
          KNOWN_EC=$?
          set -e

          if [[ "${KNOWN_EC}" -ne 0 ]]; then
            echo "::error::Expected 'dep-guard check react' to exit 0 (react should be present in any real, complete corpus)."
            cat known-out.json || true
            exit 1
          fi

          # A single hallucinated name used to be enough here, on the
          # reasoning that its non-collision against the bloom filter was a
          # deterministic property of one exact string checked against one
          # exact COMMITTED fixture corpus, verified by hand once. That
          # reasoning does not survive this job dropping --corpus-dir: the
          # corpus is now rebuilt from a live registry walk on every
          # release (see the "Build the shipped corpus" step in this
          # workflow), so a single name's non-collision is effectively a
          # fresh draw against the target false-positive rate (0.0001) on
          # every release, which means a spurious, deeply confusing release
          # failure roughly once every ten thousand releases.
          #
          # This assertion requires EVERY one of the three names to resolve
          # as unknown, not merely at least one. "At least one" is the
          # weaker check: it would still pass 87.5% of the time even if the
          # corpus's bloom filter wrongly answered "present" for roughly
          # half of all inputs -- a plausible shape for a bloom
          # deserialization regression -- because it only fails when all
          # three names happen to collide (roughly 1e-12 at the real 0.0001
          # rate, since three names each independently colliding is
          # 0.0001^3). Requiring all three to resolve as unknown fails in
          # that same corrupted-filter scenario 87.5% of the time instead,
          # which is the direction a release gate should lean. What it costs
          # is a higher spurious-failure rate against a genuinely healthy
          # corpus: roughly 3e-4 per release, from the union of three
          # independent ~0.0001 chances that any one of the three names
          # collides -- still well within tolerance for a gate that runs
          # once per release.
          set +e
          ./node_modules/.bin/dep-guard check totally-made-up-hallucinated-xyz123 --format json > unknown-1.json
          UNKNOWN_EC_1=$?
          ./node_modules/.bin/dep-guard check zzq-nonexistent-fictional-pkg-482716 --format json > unknown-2.json
          UNKNOWN_EC_2=$?
          ./node_modules/.bin/dep-guard check qwzx-imaginary-not-a-real-package-9284 --format json > unknown-3.json
          UNKNOWN_EC_3=$?
          set -e

          node -e "
            const fs = require('fs');
            const cases = [
              ['unknown-1.json', ${UNKNOWN_EC_1}],
              ['unknown-2.json', ${UNKNOWN_EC_2}],
              ['unknown-3.json', ${UNKNOWN_EC_3}],
            ];
            const allUnknown = cases.every(([file, exitCode]) => {
              if (exitCode === 0) return false;
              const j = JSON.parse(fs.readFileSync(file, 'utf8'));
              return (j.findings || []).some((f) => f.ruleId === 'unknown-package');
            });
            if (!allUnknown) {
              console.error('Expected all three hallucinated names to exit non-zero with an unknown-package finding.');
              for (const [file] of cases) {
                console.error(file, fs.readFileSync(file, 'utf8'));
              }
              process.exit(1);
            }
          "
          echo "Release smoke passed."
